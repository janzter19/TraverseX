<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 - Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif}body{color:#fff;background:linear-gradient(180deg,#ff8233,#fdac55)}
    .page{position:relative;display:flex;flex-direction:column;width:100%;height:100vh;overflow:hidden}.background{position:absolute;inset:0;display:grid;place-items:center;opacity:.8;mask-image:linear-gradient(to bottom,#000 40%,transparent 95%);-webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent 95%);pointer-events:none}.digits{font-size:clamp(200px,48vw,800px);font-weight:900;line-height:.75;letter-spacing:-.08em;white-space:nowrap;transform:scale(1.15,1.3);color:#fff}.oval{position:absolute;width:clamp(120px,20vw,400px);height:26vh;border-radius:999px;background:#fff;transform:scaleY(1.15);animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:scaleY(1.15) translateY(-12px)}}
    nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,48px)}.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:clamp(18px,2vw,22px);font-weight:800}.dots{display:grid;grid-template-columns:repeat(2,10px);gap:3px}.dots i{width:10px;height:10px;border-radius:50%;background:#fff}.nav-links{display:flex;gap:4px}.nav-links a,.menu-button,.back-button{border:0;border-radius:999px;padding:9px 16px;text-decoration:none;font-size:13px;font-weight:600;transition:opacity .2s,transform .2s}.nav-links a{color:#f16524;background:#fff}.menu-button{display:inline-flex;align-items:center;gap:7px;color:#fff;background:#f16524;cursor:pointer}.nav-links a:hover,.menu-button:hover{opacity:.9}.menu-icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
    .video-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin-top:calc(-6vh - 40px);pointer-events:none}.video-wrap video{width:62vw;height:78vh;object-fit:contain;mix-blend-mode:darken;opacity:.92}
    .bottom{position:relative;z-index:30;margin-top:auto;padding:0 16px 56px;display:flex;flex-direction:column;align-items:center;text-align:center}.bottom h1{margin:0 0 18px;font-size:clamp(18px,2.5vw,28px);font-weight:600}.back-button{display:inline-flex;align-items:center;gap:8px;color:#fff;background:#f16524;font-size:15px;padding:13px 25px}.back-button:hover{transform:scale(1.05);box-shadow:0 12px 25px #d86124aa}.arrow{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
    .menu{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility .5s}.menu.open{visibility:visible}.backdrop{position:absolute;inset:0;background:#0006;backdrop-filter:blur(5px);opacity:0;transition:opacity .5s}.menu.open .backdrop{opacity:1}.panel{position:absolute;top:0;right:0;width:min(380px,100%);height:100%;padding:22px 24px;background:linear-gradient(135deg,#ff6b1a,#ff9642);transform:translateX(100%);transition:transform .5s cubic-bezier(.16,1,.3,1)}.menu.open .panel{transform:translateX(0)}.panel-head{display:flex;align-items:center;justify-content:space-between}.close{width:40px;height:40px;border:0;border-radius:50%;color:#fff;background:#ffffff33;cursor:pointer}.close:hover{background:#ffffff4d}.panel-links{display:flex;flex-direction:column;gap:10px;margin-top:42px}.panel-links a{padding:16px 20px;border-radius:16px;color:#fff;text-decoration:none;background:#ffffff1a;font-size:18px;font-weight:700;opacity:0;transform:translateY(16px);transition:opacity .3s,transform .3s,background .3s}.panel-links a:hover{background:#ffffff33}.menu.open .panel-links a{opacity:1;transform:none}.menu.open .panel-links a:nth-child(1){transition-delay:150ms}.menu.open .panel-links a:nth-child(2){transition-delay:210ms}.menu.open .panel-links a:nth-child(3){transition-delay:270ms}.menu.open .panel-links a:nth-child(4){transition-delay:330ms}.menu.open .panel-links a:nth-child(5){transition-delay:390ms}.panel-cta{position:absolute;right:24px;bottom:24px;left:24px;text-align:center;background:#fff;color:#f16524}.panel-cta{opacity:0;transform:translateY(10px);transition:opacity .45s .45s,transform .45s .45s}.menu.open .panel-cta{opacity:1;transform:none}
    @media(max-width:768px){.nav-links{display:none}.video-wrap video{width:120vw;height:70vh}.bottom{padding-bottom:32px}.digits{transform:scale(1.15,1.15)}.oval{height:26vh}}
  </style>
</head>
<body>
  <div class="page">
    <div class="background"><div class="digits">404</div><div class="oval"></div></div>
    <nav><a class="brand" href="/"><span class="dots"><i></i><i></i><i></i><i></i></span>TinyTrails</a><div class="nav-links"><a href="#about">About Us</a><a href="#programs">Programs</a><a href="#reviews">Reviews</a><a href="#faq">FAQ</a><a href="#contacts">Contacts</a></div><button class="menu-button" id="openMenu"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menu</span></button></nav>
    <div class="video-wrap"><video autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_234424_b1332b69-2e69-4302-8dbc-40f86846afbd.mp4"></video></div>
    <div class="bottom"><h1>Oops, something went wrong!</h1><a class="back-button" href="/"><svg class="arrow" viewBox="0 0 24 24"><path d="M19 12H5m7 7-7-7 7-7"/></svg>Back to Home</a></div>
  </div>
  <div class="menu" id="menu"><div class="backdrop" id="backdrop"></div><aside class="panel"><div class="panel-head"><a class="brand" href="/"><span class="dots"><i></i><i></i><i></i><i></i></span>TinyTrails</a><button class="close" id="closeMenu" aria-label="Close menu"><svg class="arrow" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="panel-links"><a href="#about">About Us</a><a href="#programs">Programs</a><a href="#reviews">Reviews</a><a href="#faq">FAQ</a><a href="#contacts">Contacts</a></div><a class="back-button panel-cta" href="/">← Back to Home</a></aside></div>
  <script>const menu=document.getElementById('menu');const toggle=open=>{menu.classList.toggle('open',open);document.body.style.overflow=open?'hidden':''};document.getElementById('openMenu').onclick=()=>toggle(true);document.getElementById('closeMenu').onclick=()=>toggle(false);document.getElementById('backdrop').onclick=()=>toggle(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});</script>
</body></html>
